name: Verify Tense
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test review scheduler and offline audio
        run: node --test tests/test-engine.mjs tests/test-sw.cjs
      - name: Install test browsers
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve the app under its production subpath
        run: |
          mkdir -p /tmp/tense-site/tense-english
          cp -r *.html *.js *.css *.json *.svg *.png manifest.webmanifest audio /tmp/tense-site/tense-english/
          python3 -m http.server 8768 --bind 127.0.0.1 --directory /tmp/tense-site > /tmp/tense-server.log 2>&1 &
      - name: Test phone and tablet flows
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tense-qa-${{ matrix.browser }}
          path: outputs/
          retention-days: 7
